packages:
  - "apps/*"
  - "packages/*"
minimumReleaseAgeExclude:
  - viem@2.57.16
  - "@tanstack/query-core@5.105.3"
  - "@tanstack/react-query@5.105.3"
  - "@wagmi/connectors@8.2.4"
  - "@wagmi/core@3.6.9"
  - wagmi@3.7.11
# Kurulum script'i çalıştırmasına izin verilen paketler (pnpm varsayılan olarak engeller)
allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
  # Privy bağımlılıkları: native eklentilerin JS yedekleri var, script gerekmez
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false

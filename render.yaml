# Render Blueprint: indexer'ı ücretsiz planda çalıştırır (render.com → New → Blueprint → bu repo).
# Veritabanı Neon Free (süresiz, 1 GB): Render'ın ücretsiz Postgres'i 30 günde silindiği için kullanılmıyor.
# Ücretsiz servis 15 dk trafik yoksa uyur; ilk istekte ~1 dk'da uyanır ve kaldığı bloktan devam eder.
services:
  - type: web
    name: launchpad-indexer
    runtime: node
    plan: free
    # Neon veritabanı Londra'da: indexer her blokta Postgres'e yazdığı için sunucu ona yakın olmalı.
    # (Oregon↔Londra gecikmesiyle indexer saniyede ~2 blokta kalıp zincire yetişemiyordu.)
    region: frankfurt
    buildCommand: npm install -g pnpm@12 && pnpm install --frozen-lockfile --filter "@launchpad/indexer..."
    # Her deploy yeni bir şemaya baştan indeksler (testnet'te hızlı); eski şemalar Neon'da elle silinebilir.
    # Şema adı = commit hash'i (43 karakter, Ponder sınırı 45). POSIX sh uyumlu (bash'e özgü sözdizimi yok).
    startCommand: DATABASE_SCHEMA=lp_$RENDER_GIT_COMMIT pnpm --filter @launchpad/indexer start
    healthCheckPath: /health
    # Sadece indexer'ı etkileyen değişikliklerde yeniden deploy et (her deploy baştan indeksler)
    buildFilter:
      paths:
        - apps/indexer/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: LAUNCHPAD_NETWORK
        value: testnet
      - key: DATABASE_URL
        sync: false # Neon bağlantı adresi (Render panelinde girilir)

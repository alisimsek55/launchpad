name: DCA keeper

# Sunucu yerine GitHub Actions: 30 dakikada bir zamanı gelen DCA planlarını çalıştırır.
# Gerekli secret: KEEPER_PRIVATE_KEY (sadece testnet gas'ı tutan ayrı bir cüzdan;
# DeployTestnet.s.sol'da KEEPER=<adres> ile yetkilendirilir). Secret yoksa iş atlanır.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
      LAUNCHPAD_NETWORK: testnet
      # Backoff + tarama imleci çalıştırmalar arası actions/cache ile taşınır
      KEEPER_STATE_FILE: ${{ github.workspace }}/.keeper-state.json
    steps:
      - name: Secret kontrolü
        id: check
        run: echo "enabled=${{ env.KEEPER_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @launchpad/keeper...
        if: steps.check.outputs.enabled == 'true'
      # Cache anahtarları değişmez; her çalıştırma benzersiz anahtarla kaydeder (run_id), restore-keys en yenisini getirir.
      # Durum isteğe bağlıdır: cache yoksa/bozuksa keeper sıfırdan başlar.
      - uses: actions/cache/restore@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          path: .keeper-state.json
          key: keeper-state-${{ github.run_id }}
          restore-keys: keeper-state-
      - run: pnpm --filter @launchpad/keeper once
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/cache/save@v5
        if: always() && steps.check.outputs.enabled == 'true'
        with:
          path: .keeper-state.json
          key: keeper-state-${{ github.run_id }}

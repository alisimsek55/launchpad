name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Sözleşmeler (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: packages/contracts
        run: forge build --sizes
      - name: Lint
        working-directory: packages/contracts
        run: forge lint src
      - name: Test (Robinhood mainnet fork)
        working-directory: packages/contracts
        # Public RPC ara sıra rate-limit uygular: geçici hatada 30 sn bekleyip en fazla 3 kez dener
        run: for i in 1 2 3; do forge test --no-match-contract Invariant && exit 0; echo "deneme $i başarısız, tekrar"; sleep 30; done; exit 1
      - name: Invariant
        working-directory: packages/contracts
        run: for i in 1 2 3; do forge test --match-contract Invariant && exit 0; echo "deneme $i başarısız, tekrar"; sleep 30; done; exit 1

  typescript:
    name: TypeScript (web, api, indexer, keeper, subgraph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --filter "!@launchpad/contracts" --filter "!@launchpad/subgraph" typecheck
      - name: Curve matematiği testleri
        run: pnpm --filter @launchpad/shared test
      - name: Web lint + build
        run: |
          pnpm --filter @launchpad/web lint
          pnpm --filter @launchpad/web build
      - name: Subgraph build
        run: pnpm --filter @launchpad/subgraph build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Sözleşmeler (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        working-directory: packages/contracts
        run: forge build --sizes
      - name: Lint
        working-directory: packages/contracts
        run: forge lint src
      - name: Test (Robinhood mainnet fork)
        working-directory: packages/contracts
        run: forge test --no-match-contract Invariant --fork-retries 10 --fork-retry-backoff 2000
      - name: Invariant
        working-directory: packages/contracts
        # Public RPC rate-limit uygular; invariant çok istek attığı için yeniden deneme + istek hızı sınırı
        run: forge test --match-contract Invariant --fork-retries 10 --fork-retry-backoff 2000 --compute-units-per-second 100

  typescript:
    name: TypeScript (web, api, indexer, keeper, subgraph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --filter "!@launchpad/contracts" --filter "!@launchpad/subgraph" typecheck
      - name: Curve matematiği testleri
        run: pnpm --filter @launchpad/shared test
      - name: Web lint + build
        run: |
          pnpm --filter @launchpad/web lint
          pnpm --filter @launchpad/web build
      - name: Subgraph build
        run: pnpm --filter @launchpad/subgraph build

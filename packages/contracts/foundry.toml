[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "write", path = "../shared/deployments" },
  { access = "read", path = "./node_modules/@uniswap" },
  # pnpm: node_modules/@uniswap kök node_modules/.pnpm altına sembolik bağlantı
  { access = "read", path = "../../node_modules/.pnpm" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64

# Public RPC'ler (gizli değil). Production'da özel RPC kullanılacak, bkz. const.md
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[fmt]
line_length = 120

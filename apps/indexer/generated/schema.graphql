"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  token(address: String!): token
  tokens(where: tokenFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): tokenPage!
  poolToken(pool: String!): poolToken
  poolTokens(where: poolTokenFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): poolTokenPage!
  trade(id: String!): trade
  trades(where: tradeFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): tradePage!
  liquidityEvent(id: String!): liquidityEvent
  liquidityEvents(where: liquidityEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): liquidityEventPage!
  candle(token: String!, interval: Float!, time: Float!): candle
  candles(where: candleFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): candlePage!
  protocolStat(id: Int!): protocolStat
  protocolStats(where: protocolStatFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): protocolStatPage!
  dayStat(date: Int!): dayStat
  dayStats(where: dayStatFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): dayStatPage!
  tokenDay(token: String!, date: Float!): tokenDay
  tokenDays(where: tokenDayFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): tokenDayPage!
  holderStats(token: String!): holderStats
  holderStatss(where: holderStatsFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): holderStatsPage!
  balance(token: String!, holder: String!): balance
  balances(where: balanceFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): balancePage!
  _meta: Meta
}

